function medicineRows(){return(data['약품기록']||[]).slice()}
function medType(r){return r['구분']==='사용반출'?'사용':String(r['구분']||'')}
function medKey(r){return String(r['약품명']||'').trim()+'|'+String(r['단위']||'').trim()}
function medDelta(r){const q=Number(r['수량']||0),t=medType(r);return t==='반입'?q:(['사용','반품','폐기'].includes(t)?-q:0)}
function medicineProducts(){const map={};medicineRows().slice().sort((a,b)=>String(a['날짜']).localeCompare(String(b['날짜']))||String(a['입력시간']).localeCompare(String(b['입력시간']))).forEach(r=>{const key=medKey(r);if(!r['약품명']||!r['단위'])return;if(!map[key])map[key]={key,name:r['약품명'],unit:r['단위'],stock:0,days:0,note:'',last:''};map[key].stock+=medDelta(r);if(medType(r)==='반입'){map[key].days=Number(r['휴약기간']||0);map[key].note=r['특이사항']||map[key].note;map[key].last=r['날짜']||map[key].last}});return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name,'ko'))}

function medTabs(){return`<div class="medicine-tabs">${[['receipt','반입'],['shelf','보관 중'],['use','사용'],['dispose','반품·폐기'],['history','전체 이력']].map(x=>`<button data-medmode="${x[0]}" class="${medicineMode===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>`}
function bindMedTabs(){document.querySelectorAll('[data-medmode]').forEach(b=>b.onclick=()=>{medicineMode=b.dataset.medmode;medicineEditId='';medicineRepeat=null;medicineView()})}
function selectedMedicineProduct(products){return products.find(x=>x.key===$('#mproduct').value)}
async function saveMedicineRow(row,repeat=false,confirmed=false){if(!admin)return haccpLoginView();if(!confirmed&&!confirm(`${row.구분==='사용'?row.대상동+'동에 ':''}${row.약품명} ${fmt(row.수량)}${row.단위} ${row.구분} 기록을 저장할까요?`))return;loading('약품 기록 저장 중...');try{const r=await api({action:'saveMedicine',password:admin,row});if(!r.ok)throw Error(r.error);await pull(false,'haccp');if(repeat&&row.구분==='사용'){medicineRepeat={date:row.날짜,key:medKey(row),note:row.특이사항};medicineMode='use';medicineEditId='';medicineView()}else{medicineRepeat=null;medicineMode=row.구분==='반입'?'shelf':'history';medicineEditId='';medicineView()}}catch(e){alert('저장 실패: '+e.message)}finally{loading('',false)}}

  }else if(medicineMode==='shelf'){

async function haccpFilesView(category='전체',recordId=''){if(!admin)return haccpLoginView();haDispose();const token=haSerial;haSession={token,queue:[],files:[],records:{},loading:true,busy:false,category,recordId};page('HACCP 사진·파일','',`<div class="card ha-intro"><h2>${farmIcon('check')} 계속 보관하는 HACCP 자료</h2><p>사육완료·초기화 후에도 유지됩니다. 사진·파일은 직접 삭제할 때까지 보관합니다.</p></div><div class="card"><h2>자료 추가</h2><div class="grid2"><label class="field">분류<select id="haCategory">${Object.entries(HA_LABELS).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label><label class="field">자료 날짜<input id="haDate" type="date" value="${today()}"></label></div><label class="field" id="haRecordField">연결할 기록<select id="haRecord"><option value="">개별 기록 연결 없이 보관</option></select><small>기록을 먼저 저장한 뒤 선택할 수 있습니다.</small></label><label class="field">자료 제목<input id="haTitle" maxlength="150" placeholder="예: 교육 사진, 소독 확인서 (선택)"></label><div class="ha-pickers"><label>사진 촬영<input id="haCamera" type="file" accept="image/*" capture="environment"></label><label>앨범에서 선택<input id="haGallery" type="file" accept="image/*" multiple></label><label>파일 첨부<input id="haDocument" type="file" accept=".pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx" multiple></label></div><p class="ha-hint">사진은 읽기 좋은 크기로 자동 조정합니다. 문서는 파일당 10MB까지 올릴 수 있습니다.</p><div id="haQueue" aria-live="polite"></div><button id="haSave" class="save" disabled>선택한 자료 저장</button><p id="haStatus" role="status">보관자료를 확인하고 있습니다…</p></div><button id="haBack" class="sectionbtn haccp-back">← 돌아가기</button><div class="card"><h2>보관자료 <span id="haCount"></span></h2><div class="grid2"><label class="field">분류 보기<select id="haFilter"><option value="전체">전체</option>${Object.entries(HA_LABELS).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label><label class="field">제목·파일명 검색<input id="haSearch" type="search" placeholder="보관자료 찾기"></label></div><div id="haFiles"></div></div>`);haccpStyle();$('#haCategory').value=HA_LABELS[category function haWithin(promise,ms,message){let timer;return Promise.race([promise,new Promise((resolve,reject)=>timer=setTimeout(()=>reject(Error(message)),ms))]).finally(()=>clearTimeout(timer))}
async function haPrepare(file){if(file.size>30*1024*1024)throw Error('사진 원본은 30MB 이하로 선택해주세요.');const ext=file.name.split('.').pop().toLowerCase(),image=['jpg','jpeg','png','webp','heic','heif'].includes(ext)||/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type);if(!image){if(!['pdf','hwp','hwpx','doc','docx','xls','xlsx','ppt','pptx'].includes(ext))throw Error('사진·PDF·한글·Office 문서를 선택해주세요.');if(file.size>10*1024*1024)throw Error('문서는 파일당 10MB 이하로 선택해주세요.');return{blob:file,name:file.name,preview:''}}let url=URL.createObjectURL(file);try{const img=new Image();img.src=url;try{await haWithin(img.decode(),20000,'사진을 읽는 시간이 오래 걸립니다. 다른 사진으로 다시 선택해주세요.')}catch(e){throw Error('이 사진 형식을 읽지 못했습니다. JPG·PNG 사진으로 다시 선택해주세요.')}if(!img.naturalWidth||!img.naturalHeight)throw Error('사진을 읽지 못했습니다.');const scale=Math.min(1,2000/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);const blob=await haWithin(new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.86)),20000,'사진 변환 시간이 초과되었습니다. 다른 사진으로 다시 선택해주세요.');c.width=1;c.height=1;if(!blob||blob.size>10*1024*1024)throw Error('사진 변환에 실패했습니다. 다른 사진으로 선택해주세요.');return{blob,name:file.name.replace(/\.[^.]+$/,'')+'.jpg',preview:URL.createObjectURL(blob)}}finally{URL.revokeObjectURL(url)}}
async function haAddFiles(files,token){if(!haSession||haSession.busy||haSession.preparing)return;const status=$('#haStatus');if(files.length>10)return alert('한 번에 10개까지 선택해주세요.');haSession.preparing=true;haRenderQueue();const errors=[];for(const file of files){if(!haSession||haSession.token!==token)return;status.textContent=file.name+' 확인 중…';try{const prepared=await haPrepare(file);if(!haSession||haSession.token!==token){if(prepared.preview)URL.revokeObjectURL(prepared.preview);return}haSession.queue.push({...prepared,id:uid().replace(/[^a-zA-Z0-9_-]/g,''),state:'ready',error:''})}catch(e){errors.push(file.name+': '+e.message)}}if(!haSession||haSession.token!==token)return;haSession.preparing=false;status.textContent=errors.join('\n');status.className=errors.length?'medicine-warning':'';haRenderQueue()}
function haRenderQueue(){const s=haSession;if(!s)return;$('#haQueue').innerHTML=s.queue.map((q,i)=>`<div class="ha-queue-row">${q.preview?`<img src="${q.preview}" alt="선택한 사진 미리보기">`:'<span class="ha-file-icon">문서</span>'}<div><b>${esc(q.name)}</b><small>${haBytes(q.blob.size)} · ${q.state==='saved'?'저장 완료':q.state==='saving'?'저장 중':q.error?esc(q.error):'저장 대기'}</small></div><button data-ha-remove="${i}" class="sectionbtn" ${s.busy?'disabled':''}>${q.state==='saved'?'닫기':'제외'}</button></div>`).join('');document.querySelectorAll('[data-ha-remove]').forEach(b=>b.onclick=()=>{const q=s.queue.splice(Number(b.dataset.haRemove),1)[0];if(q.preview)URL.revokeObjectURL(q.preview);haRenderQueue()});$('#haSave').disabled=s.loading||s.busy||s.preparing||!s.queue.some(q=>q.state!=='saved');document.querySelectorAll('.ha-pickers input').forEach(e=>e.disabled=s.busy||s.preparing);for(const id of ['haCategory','haRecord','haDate','haTitle'])$('#'+id).disabled=s.busy||s.queue.some(q=>q.payload)}
function haToBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(Error('파일 읽기 실패'));r.readAsDataURL(blob)})}
async function haSaveFiles(){const s=haSession;if(!s||s.busy||s.loading||s.preparing)return;const category=$('#haCategory').value,date=$('#haDate').value,recordId=category==='공통서류'?'':$('#haRecord').value,title=$('#haTitle').value.trim();if(!date)return alert('자료 날짜를 선택해주세요.');s.busy=true;haRenderQueue();let failed=0;for(const q of s.queue.filter(x=>x.state!=='saved')){q.payload=q.payload||{category,date,recordId,title};q.state='saving';q.error='';haRenderQueue();$('#haStatus').textContent=q.name+' 저장 중…';try{const base64=await haToBase64(q.blob),r=await api({action:'haccpFileUpload',password:admin,id:q.id,name:q.name,base64,...q.payload});if(!r.ok)throw Error(r.error);q.state='saved';s.files=[r.row,...s.files.filter(x=>String(x.id)!==String(r.row.id))];haRenderFiles()}catch(e){q.state='error';q.error=haMessage(e);failed++}if(haSession!==s)return}if(haSession!==s)return;s.busy=false;s.queue=s.queue.filter(q=>{if(q.state!=='saved')return true;if(q.preview)URL.revokeObjectURL(q.preview);return false});haRenderQueue();$('#haStatus').textContent=failed?'일부 자료를 저장하지 못했습니다. 다시 저장을 누르면 실패한 자료만 재시도합니다.':'선택한 자료를 보관했습니다. 사육완료·초기화 후에도 유지됩니다.';$('#haStatus').className=failed?'medicine-warning':''}
function haRenderFiles(){const s=haSession;if(!s)return;const category=$('#haFilter').value,query=$('#haSearch').value.trim().toLowerCase(),files=s.files.filter(r=>(category==='전체'||r['분류']===category)&&(!s.recordId||String(r['연결기록ID'])===s.recordId)&&[r['제목'],r['파일명']].join(' ').toLowerCase().includes(query));$('#haCount').textContent=files.length+'개';$('#haFiles').innerHTML=files.map((r,i)=>{const linked=(s.records[r['분류']]||[]).find(x=>String(x.id)===String(r['연결기록ID']));return`<article class="ha-saved"><span class="ha-file-icon">${String(r.MIME).startsWith('image/')?'사진':'문서'}</span><div><b>${esc(r['제목']||r['파일명'])}</b><small>${esc(HA_LABELS[r['분류']]||r['분류'])} · ${esc(r['자료일'])} · ${haBytes(Number(r['크기']))}</small><small>${esc(r['파일명'])}</small>${r['연결기록ID']?`<small>연결 기록: ${esc(linked?linked.date+' · '+linked.label:'기존 기록 삭제됨 · 첨부자료는 계속 보관')}</small>`:''}<div class="ha-file-actions"><a href="${haDriveLink(r['파일ID'])}" target="_blank" rel="noopener">열기</a><a href="${haDriveLink(r['파일ID'],true)}" target="_blank" rel="noopener">다운로드</a><button data-ha-delete="${i}" class="danger">삭제</button></div></div></article>`}).join('')||'<p class="empty">조건에 맞는 보관자료가 없습니다.</p>';document.querySelectorAll('[data-ha-delete]').forEach(b=>b.onclick=async()=>{if(s.busy)return alert('자료 저장이 끝난 뒤 삭제해주세요.');const r=files[Number(b.dataset.haDelete)];if(!confirm((r['제목']||r['파일명'])+' 자료를 삭제할까요?\n드라이브 원본은 휴지통으로 이동합니다.'))return;b.disabled=true;try{const res=await api({action:'haccpFileDelete',password:admin,id:r.id});if(!res.ok)throw Error(res.error);if(haSession!==s)return;s.files=s.files.filter(x=>String(x.id)!==String(r.id));haRenderFiles()}catch(e){if(haSession===s){alert(haMessage(e));b.disabled=false}}})}
const haMenuBefore=haccpView;haccpView=function(){haDispose();haMenuBefore();if(!admin)return;const menu=document.querySelector('.haccp-menu');if(!menu)return;const b=document.createElement('button');b.className='haccp-menu-item';b.id='haOpen';b.innerHTML='<span class="haccp-menu-icon">'+farmIcon('house')+'</span><span><b>사진·파일 보관</b><small>촬영 · 앨범 · 문서 · 회차와 별도 보관</small></span><span class="haccp-chevron">›</span>';menu.appendChild(b);b.onclick=()=>haccpFilesView()};
function haEntry(category,selector){if(!admin)return;const p=$('#view>.page'),b=document.createElement('button');b.className='sectionbtn ha-section-entry';b.textContent='사진·파일 첨부 및 보관자료 보기';b.onclick=()=>haccpFilesView(category);p.insertBefore(b,p.querySelector('.card'));document.querySelectorAll(selector).forEach(delButton=>{const id=delButton.dataset.delDis||delButton.dataset.delEdu||delButton.dataset.delMed;const a=document.createElement('button');a.className='sectionbtn ha-record-entry';a.textContent='첨부자료';a.onclick=()=>haccpFilesView(category,id);delButton.parentElement.appendChild(a)})}
const haDisBefore=disinfectionView;disinfectionView=function(){haDisBefore();haEntry('소독방역','[data-del-dis]')};
const haEduBefore=educationView;educationView=function(){haEduBefore();haEntry('교육기록','[data-del-edu]')};
const haMedBefore=medicineView;medicineView=function(){haMedBefore();haEntry('약품기록','[data-del-med]')};
const haOpenTabBefore=openTab;openTab=async function(name){if(haSession?.busy)return alert('자료 저장이 끝난 뒤 이동해주세요.');haDispose();return haOpenTabBefore(name)};

const ENTRY_TEST_DATA={'농장정보':[{농장명:'청운농장 · 입력 검수'}],'현재회차':[{id:'keypad-fixture',입추일:'2026-09-15',덤비율:2}],'사육기록':[{id:'old-record',회차ID:'2026-09-15',날짜:today(),일령:40,동:3,폐사:2,도태:1,特異事項:'',특이사항:'기존 검수 기록',입력시간:new Date().toISOString()}],'출하기록':[],'계사정보':[],'일일점검':[]};
let entryTestCalls=0,entryTestFail=false;
function entryTestBadge(row){const e=document.querySelector('#entryTestStatus');if(e)e.textContent='가상자료 · 저장 호출 '+entryTestCalls+'회 · '+(row?JSON.stringify(row):'실제 농장 자료 아님')}
api=async function(b){if(b.action==='pull')return{ok:true,data:ENTRY_TEST_DATA};if(b.action==='save'&&b.sheet==='사육기록'){entryTestCalls++;entryTestBadge(b.row);if(entryTestFail){entryTestFail=false;return{ok:false,error:'검수용 저장 실패'}}const old=ENTRY_TEST_DATA['사육기록'].findIndex(r=>r.id===b.row.id);if(old<0)ENTRY_TEST_DATA['사육기록'].push({...b.row,입력시간:new Date().toISOString()});else ENTRY_TEST_DATA['사육기록'][old]={...b.row,입력시간:new Date().toISOString()};return{ok:true,id:b.row.id}}return{ok:false,error:'검수 화면에서는 실제 서버를 변경할 수 없습니다.'}};
window.addEventListener('load',()=>{data=ENTRY_TEST_DATA;tab='home';house=0;$('#sync').textContent='v2.6.0 · 가상자료';const bar=document.createElement('aside');bar.style.cssText='position:fixed;bottom:0;left:0;z-index:10000;background:#fff5cf;font-size:11px;max-width:260px;overflow-wrap:anywhere';bar.innerHTML='<div id="entryTestStatus"></div><button id="entryTestFail">다음 저장 실패</button><button id="entryTestLoading">로딩 화면</button><button id="entryTestReady">입력 화면</button>';document.body.appendChild(bar);$('#entryTestFail').onclick=()=>{entryTestFail=true;$('#entryTestFail').textContent='실패 예약됨'};$('#entryTestLoading').onclick=homeLoadingView;$('#entryTestReady').onclick=()=>{house=0;homeView()};entryTestBadge();render()});

</script></body></html>

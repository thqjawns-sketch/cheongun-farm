<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176b3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="청운농장">
  <title>청운농장 육계 사육관리</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script>
    const FARM_APP_URL='https://script.google.com/macros/s/AKfycbyUOaqnkX1VSrBJ3Ee7IcPMcbRsmrikeotDfqn7IXsyvsCfcXS6CRDeF3o86Wzu366ojg/exec';
    const IS_INSTALLED=window.navigator.standalone||window.matchMedia('(display-mode: standalone)').matches;
    if(IS_INSTALLED) window.location.replace(FARM_APP_URL+'?from=pwa&shell=17.9');
  </script>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#f4f7f4;color:#132019;font-family:Arial,"Noto Sans KR",sans-serif}body{display:grid;place-items:center;padding:24px}.card{width:min(100%,480px);padding:36px 24px 28px;border:1px solid #d8e2da;border-radius:24px;background:#fff;box-shadow:0 12px 38px #102d1b18;text-align:center}.logo{width:92px;height:92px;border-radius:24px;box-shadow:0 8px 20px #176b3a25}.card h1{margin:20px 0 8px;font-size:28px}.card p{margin:0 0 25px;color:#68736c;line-height:1.55}.btn{display:block;width:100%;min-height:62px;margin-top:12px;border:0;border-radius:16px;font-size:18px;font-weight:900;cursor:pointer}.install{background:#176b3a;color:#fff}.open{border:2px solid #176b3a;background:#fff;color:#176b3a;text-decoration:none;line-height:58px}.help{margin-top:20px!important;font-size:13px}.status{min-height:22px;margin-top:12px;color:#176b3a;font-size:13px;font-weight:700}@media(display-mode:standalone){body{background:#176b3a}.card{display:none}}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./icon-192.png" alt="청운농장 앱 아이콘">
    <h1>청운농장 육계 사육관리</h1>
    <p>농장 작업자가 함께 사용하는 사육관리 앱입니다.<br>아래 버튼으로 설치한 뒤 홈 화면에서 실행하세요.</p>
    <button id="installButton" class="btn install" type="button">청운농장 앱 설치</button>
    <a class="btn open" href="https://script.google.com/macros/s/AKfycbyUOaqnkX1VSrBJ3Ee7IcPMcbRsmrikeotDfqn7IXsyvsCfcXS6CRDeF3o86Wzu366ojg/exec">설치하지 않고 앱 열기</a>
    <div id="status" class="status">설치 준비 중입니다.</div>
    <p class="help">설치 버튼이 반응하지 않으면 크롬 메뉴(⋮)에서<br><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 선택하세요.</p>
  </main>
  <script>
    const installButton=document.getElementById('installButton'),status=document.getElementById('status');
    let installPrompt=null;
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;status.textContent='설치할 수 있습니다.'});
    installButton.addEventListener('click',async()=>{if(!installPrompt){status.textContent='크롬 메뉴(⋮)에서 홈 화면에 추가를 눌러주세요.';return}installPrompt.prompt();const result=await installPrompt.userChoice;installPrompt=null;status.textContent=result.outcome==='accepted'?'설치가 완료되면 홈 화면에서 실행하세요.':'설치가 취소되었습니다.'});
    window.addEventListener('appinstalled',()=>{status.textContent='설치 완료! 홈 화면의 청운농장 아이콘을 눌러주세요.'});
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
  </script>
</body>
</html>

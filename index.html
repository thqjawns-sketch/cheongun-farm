<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b3a">
  <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="청운농장">
  <title>청운농장 육계 사육관리</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png">
  <style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f7f4;font-family:Arial,"Noto Sans KR",sans-serif}#farmApp{display:block;width:100%;height:100%;border:0;background:#fff}#installPanel{position:fixed;z-index:20;right:12px;top:calc(12px + env(safe-area-inset-top));display:none;align-items:center;gap:7px;padding:7px;border-radius:14px;background:#fff;box-shadow:0 5px 22px #102d1b38}#installButton{border:0;border-radius:10px;padding:10px 13px;background:#176b3a;color:#fff;font-weight:900}#closeInstall{width:34px;height:34px;border:0;border-radius:9px;background:#eef3ef;color:#526058;font-size:18px}#iosGuide{position:fixed;z-index:30;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:none;padding:13px 42px 13px 14px;border:1px solid #cddbd1;border-radius:13px;background:#fff;box-shadow:0 7px 25px #102d1b38;font-size:13px;line-height:1.45}#iosGuide button{position:absolute;right:8px;top:8px;width:30px;height:30px;border:0;border-radius:8px;background:#eef3ef}#loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#f4f7f4;color:#176b3a;font-weight:900}#loading span{display:block;margin-top:8px;color:#6b786f;font-size:12px;font-weight:400}@media(display-mode:standalone){#installPanel,#iosGuide{display:none!important}}</style>
</head>
<body>
  <div id="loading"><div style="text-align:center"><img src="./icon-192.png" width="72" height="72" style="border-radius:18px" alt=""><br>청운농장 앱 여는 중<span>시트 자료를 안전하게 불러옵니다.</span></div></div>
  <iframe id="farmApp" title="청운농장 육계 사육관리" allow="microphone; camera; clipboard-read; clipboard-write" src="https://script.google.com/macros/s/AKfycbyUOaqnkX1VSrBJ3Ee7IcPMcbRsmrikeotDfqn7IXsyvsCfcXS6CRDeF3o86Wzu366ojg/exec"></iframe>
  <div id="installPanel"><button id="installButton" type="button">청운농장 앱 설치</button><button id="closeInstall" type="button" aria-label="닫기">×</button></div>
  <div id="iosGuide"><b>아이폰 설치 방법</b><br>Safari의 공유 버튼을 누른 뒤 <b>‘홈 화면에 추가’</b>를 선택하세요.<button type="button" aria-label="닫기">×</button></div>
  <script>
const frame=document.getElementById('farmApp'),loading=document.getElementById('loading'),panel=document.getElementById('installPanel'),installButton=document.getElementById('installButton');
frame.addEventListener('load',()=>loading.style.display='none');
setTimeout(()=>loading.style.display='none',12000);
let installPrompt=null,voiceRecognition=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(!window.matchMedia('(display-mode: standalone)').matches)panel.style.display='flex'});
installButton.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;panel.style.display='none'});
document.getElementById('closeInstall').onclick=()=>panel.style.display='none';
window.addEventListener('appinstalled',()=>panel.style.display='none');
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=window.navigator.standalone||window.matchMedia('(display-mode: standalone)').matches;
if(ios&&!standalone){const guide=document.getElementById('iosGuide');guide.style.display='block';guide.querySelector('button').onclick=()=>guide.style.display='none'}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));

function sendVoice(payload){if(frame.contentWindow)frame.contentWindow.postMessage(payload,'*')}
async function startTopLevelVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){sendVoice({type:'cheongun-voice-error',message:'이 기기에서는 음성입력을 지원하지 않습니다. Chrome을 최신 버전으로 업데이트해주세요.'});return}
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('unsupported');
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(track=>track.stop());
  }catch(err){
    sendVoice({type:'cheongun-voice-error',message:err&&err.name==='NotAllowedError'?'마이크 권한이 차단되었습니다. 사이트 설정에서 마이크를 허용해주세요.':'마이크를 사용할 수 없습니다. 기기 설정을 확인해주세요.'});
    return;
  }
  voiceRecognition=new SR();
  voiceRecognition.lang='ko-KR';
  voiceRecognition.interimResults=false;
  voiceRecognition.maxAlternatives=1;
  voiceRecognition.onstart=()=>sendVoice({type:'cheongun-voice-status',message:'말씀하세요: 1동 폐사 5 도태 6 특이사항 없음'});
  voiceRecognition.onresult=e=>sendVoice({type:'cheongun-voice-result',text:e.results[0][0].transcript});
  voiceRecognition.onerror=e=>sendVoice({type:'cheongun-voice-error',message:e.error==='not-allowed'?'마이크 권한을 허용해주세요.':e.error==='no-speech'?'음성이 들리지 않았습니다. 다시 눌러주세요.':'음성인식 오류: '+e.error});
  voiceRecognition.onend=()=>{sendVoice({type:'cheongun-voice-status',message:'음성 입력이 끝났습니다.'});voiceRecognition=null};
  try{voiceRecognition.start()}catch(err){sendVoice({type:'cheongun-voice-error',message:'음성입력을 시작할 수 없습니다. 다시 눌러주세요.'})}
}
window.addEventListener('message',e=>{
  if(e.source!==frame.contentWindow||!e.data||e.data.type!=='cheongun-start-voice')return;
  startTopLevelVoice();
});
</script>
</body></html>

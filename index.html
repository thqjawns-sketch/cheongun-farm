function completionIssues(){const issues=[],ships=data['출하기록']||[],checks=data['일일점검']||[],photos=data['첨부파일']||[];[1,2,3,4,5].forEach(h=>{if(!ships.some(x=>Number(x['동'])===h&&x['구분']==='전체출하'))issues.push(h+'동 전체출하 미입력');if(!checks.some(x=>Number(x['동'])===h))issues.push(h+'동 오늘점검 없음')});if(!photos.some(x=>x['구분']==='입추'))issues.push('입추 증빙사진 없음');if(!photos.some(x=>x['구분']==='출하'))issues.push('출하 증빙사진 없음');return issues}
function openUrl(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
async function reportAction(action){const complete=action==='completeFlock';if(complete){const issues=completionIssues(),warning=issues.length?'\n\n확인 필요:\n- '+issues.join('\n- '):'';if(!confirm('PDF가 정상 생성된 뒤에만 현재 파스 자료를 초기화합니다.'+warning+'\n\n계속할까요?'))return}loading(complete?'최종 PDF 생성·검증 및 사육완료 처리 중...':'종합보고서 생성 중...');try{const r=await api({action,password:admin,endDate:today()});if(!r.ok)throw Error(r.error);await pull(false);openUrl(r.url);if(complete)alert('사육완료 처리되었습니다. 종합보고서 PDF만 보관됩니다.')}catch(e){alert('처리 실패: '+e.message+'\n시트자료는 삭제하지 않았습니다.')}finally{loading('',false)}}
function stopOverviewRefresh(){if(overviewTimer){clearInterval(overviewTimer);overviewTimer=null}}
async function refreshOverviewAuto(){if(tab!=='overview'||busy||document.visibilityState==='hidden')return;const y=window.scrollY,scroller=document.querySelector('.overview-page'),x=scroller?scroller.scrollLeft:0;await pull(false,'overview');requestAnimationFrame(()=>{window.scrollTo(0,y);const next=document.querySelector('.overview-page');if(next)next.scrollLeft=x})}
function scheduleOverviewRefresh(){stopOverviewRefresh();if(tab==='overview')overviewTimer=setInterval(refreshOverviewAuto,300000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')stopOverviewRefresh();else if(tab==='overview'){refreshOverviewAuto();scheduleOverviewRefresh()}});

function farmIcon(name){return `<svg class="farm-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${FARM_ICONS[name]||FARM_ICONS.chart}</svg>`}
function styleHouseButtons(){document.querySelectorAll('[data-oh],[data-house],[data-jhouse]').forEach(b=>{const h=Number(b.dataset.oh??b.dataset.house??b.dataset.jhouse);if(h>0&&h<6){b.classList.add('farm-house-button');b.style.setProperty('--house-color',C[h-1]);b.style.setProperty('--house-ink',h===3?'#765500':C[h-1]);b.style.setProperty('--house-tint',['#fff1f1','#fff3e9','#fff9db','#edf8f1','#edf3ff'][h-1])}})}
function overviewDayDetail(h,d){
 const date=dateAt(d),rr=(data['사육기록']||[]).filter(r=>Number(r['동'])===h&&Number(r['일령'])===d),ck=(data['일일점검']||[]).filter(r=>Number(r['동'])===h&&Number(r['일령'])===d),ss=(data['출하기록']||[]).filter(r=>Number(r['동'])===h&&Number(r['일령'])===d),uses=flockMedicineUses(h).filter(r=>String(r['날짜']).slice(0,10)===date),state=medicineDayState(h,date),death=rr.reduce((n,r)=>n+Number(r['폐사']||0),0),cull=rr.reduce((n,r)=>n+Number(r['도태']||0),0);
 const climate=ck.map(c=>`${c['온도']!==''&&c['온도']!=null?esc(c['온도'])+'℃':'—'} / ${c['습도']!==''&&c['습도']!=null?esc(c['습도'])+'%':'—'}`).join('<br>')||'—';
 const meds=uses.map(r=>`${farmIcon('medicine')}${esc(r['약품명'])} ${fmt(r['수량'])}${esc(r['단위'])}`).join('<br>'),hold=state.blocked?`<span class="withdrawal-text">${farmIcon('clock')}휴약 중 · ${esc(state.end)}부터 출하 가능</span>`:state.available?`<span class="normal-text">${farmIcon('check')}휴약 종료 · 출하 가능</span>`:'';
 return `<tr class="${d===ageAt()?'today-row':''}"><th>${d}일령<small>${date.slice(5)}</small></th><td>${fmt(death)}</td><td>${fmt(cull)}</td><td class="total">${fmt(death+cull)}</td><td>${climate}</td><td class="detail-text">${rr.map(r=>esc(r['특이사항']||'')).filter(Boolean).join('<br>')||'—'}</td><td class="detail-text">${ck.map(c=>`<b class="${c['결과']==='이상'?'withdrawal-text':'normal-text'}">${esc(c['결과']||'점검')}</b>${c['내용및조치']?' · '+esc(c['내용및조치']):''}`).join('<br>')||'<span class="pending-text">미작성</span>'}</td><td class="detail-text medicine-cell">${[meds,hold].filter(Boolean).join('<br>')||'—'}</td><td class="detail-text">${ss.map(r=>`${esc(r['구분'])} ${fmt(r['출하수'])}수`).join('<br>')||'—'}</td></tr>`;
}
function decorateOverviewV226(){
 if(!current())return;
 const board=document.querySelector('.overview-board');if(!board)return;board.classList.toggle('house-overview',!!graphHouse);
 const cards=[...board.querySelectorAll('.overview-kpi')];cards.forEach((c,i)=>{c.classList.add(['kpi-stock','kpi-loss','kpi-ship','rate-official','rate-bonus','rate-actual'][i]);c.insertAdjacentHTML('afterbegin',farmIcon(['chicken','alert','truck','chart','chart','check'][i]))});
 board.querySelectorAll('.overview-house-table tbody tr').forEach(tr=>{[...tr.querySelectorAll('.overview-rate')].forEach((c,i)=>c.classList.add(['rate-official','rate-bonus','rate-actual'][i]))});
 const alertCard=[...board.querySelectorAll('.overview-card')].find(c=>c.querySelector('h2')?.textContent==='현장 특이사항·점검 이상');
 if(alertCard){alertCard.classList.add('overview-alert-card');alertCard.querySelector('h2').innerHTML=farmIcon('alert')+(graphHouse?`${graphHouse}동 누적 특이사항 · 점검 이상·조치`:'오늘 현장 특이사항 · 점검 이상·조치')}
 if(graphHouse){
  const h=graphHouse,m=journalMetrics().find(x=>x.h===h),info=(data['계사정보']||[]).find(r=>Number(r['동'])===h)||{},area=Number(info['사육면적']||0),rr=(data['사육기록']||[]).filter(r=>Number(r['동'])===h),on=date=>rr.filter(r=>String(r['날짜']).slice(0,10)===date),now=on(today()),yesterday=new Date(today()+'T12:00:00');yesterday.setDate(yesterday.getDate()-1);const prevDate=yesterday.getFullYear()+'-'+String(yesterday.getMonth()+1).padStart(2,'0')+'-'+String(yesterday.getDate()).padStart(2,'0'),prev=on(prevDate),sum=(rows,key)=>rows.reduce((n,r)=>n+Number(r[key]||0),0),delta=sum(now,'폐사')+sum(now,'도태')-sum(prev,'폐사')-sum(prev,'도태'),canCompare=ageAt()>1&&now.length&&prev.length,checks=(data['일일점검']||[]).filter(r=>Number(r['동'])===h&&String(r['날짜']).slice(0,10)===today()),status=checks.some(c=>c['결과']==='이상')?'이상':checks.length?'정상':'미작성';
  const cells=[['house','공식 입추수',fmt(m.official)+'수'],['chicken','덤 포함 입추수',fmt(m.bonus)+'수'],['house','사육면적',area?fmt(area)+'㎡':'—'],['chicken','현재 사육밀도',area?(m.bonusCurrent/area).toFixed(2)+'수/㎡':'—'],['alert','오늘 폐사',now.length?fmt(sum(now,'폐사'))+'수':'미입력'],['alert','오늘 도태',now.length?fmt(sum(now,'도태'))+'수':'미입력'],['chart','전일 대비',canCompare?(delta>0?'+':'')+fmt(delta)+'수':'—'],['check','오늘 점검',status]];
  const main=board.querySelector('.overview-main>.overview-card');main.classList.add('overview-house-details');main.innerHTML=`<h2>${farmIcon('house')}${h}동 상세정보</h2><div class="house-detail-cells">${cells.map(([icon,label,value])=>`<div><span>${farmIcon(icon)}${label}</span><b class="${label==='오늘 점검'?(status==='정상'?'normal-text':status==='이상'?'withdrawal-text':'pending-text'):''}">${value}</b></div>`).join('')}</div>`;
  board.querySelector('.overview-side')?.remove();
  const table=board.querySelector('.overview-day-table');table.classList.add('house-daily-table');table.querySelector('thead').innerHTML=`<tr><th>일령·날짜</th><th>폐사</th><th>도태</th><th>합계</th><th>${farmIcon('temp')}온도·습도</th><th>현장 특이사항</th><th>${farmIcon('check')}일일점검·조치</th><th>${farmIcon('medicine')}약품·휴약정보</th><th>${farmIcon('truck')}출하</th></tr>`;table.querySelector('tbody').innerHTML=Array.from({length:ageAt()},(_,i)=>overviewDayDetail(h,ageAt()-i)).join('');
 }
 board.querySelectorAll('h2').forEach(e=>{if(e.querySelector('svg'))return;const t=e.textContent;if(t.includes('출하'))e.insertAdjacentHTML('afterbegin',farmIcon('truck'));else if(t.includes('입추'))e.insertAdjacentHTML('afterbegin',farmIcon('chicken'));else if(t.includes('농장'))e.insertAdjacentHTML('afterbegin',farmIcon('leaf'));else if(t.includes('기록')||t.includes('추이'))e.insertAdjacentHTML('afterbegin',farmIcon('chart'))});
 styleHouseButtons();
}

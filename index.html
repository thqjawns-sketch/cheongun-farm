<script>
const VERSION='2.1.4',C=['#dc2626','#ea580c','#d99a00','#16803a','#2563eb'],ITEMS=['사료 공급','급수 상태','환기 상태','온도·습도','계군 건강상태','깔짚·바닥','폐사체 처리','출입·소독 관리','시설·전기'];
const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('ko-KR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
function timeText(v){if(!v)return'-';const d=new Date(v);return isNaN(d)?'-':d.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})}
function checkedTime(){return new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})}
let data={},tab='home',house=0,jHouse=0,jBasis='official',admin='',busy=false,loadSeq=0;
const GAS_URL='https://script.google.com/macros/s/AKfycbyUOaqnkX1VSrBJ3Ee7IcPMcbRsmrikeotDfqn7IXsyvsCfcXS6CRDeF3o86Wzu366ojg/exec';
let apiBridgeTarget=null,apiBridgeResolve=null,apiBridgeReady=new Promise(r=>apiBridgeResolve=r),apiSeq=0;
const apiPending=new Map();
function directGas(){return typeof google!=='undefined'&&google.script&&google.script.run}
function initApiBridge(){if(directGas()||document.getElementById('apiBridge'))return;const f=document.createElement('iframe');f.id='apiBridge';f.src=GAS_URL+'?mode=bridge&v='+VERSION;f.setAttribute('aria-hidden','true');f.style.cssText='position:fixed;width:1px;height:1px;left:-9999px;border:0;opacity:0';document.body.appendChild(f)}
window.addEventListener('message',e=>{const m=e.data;if(!m||!m.type)return;if(m.type==='cheongun-api-ready'){apiBridgeTarget=e.source;apiBridgeResolve();return}if(m.type==='cheongun-api-response'&&apiPending.has(m.id)){const p=apiPending.get(m.id);apiPending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(Error(m.error)):p.resolve(m.result)}});
function api(body){if(directGas())return new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('서버 응답 시간 초과')),60000);google.script.run.withSuccessHandler(r=>{clearTimeout(t);resolve(r)}).withFailureHandler(e=>{clearTimeout(t);reject(Error(e.message||e))}).apiRequest(JSON.stringify(body))});initApiBridge();return new Promise(async(resolve,reject)=>{let readyTimer;try{await Promise.race([apiBridgeReady,new Promise((_,bad)=>readyTimer=setTimeout(()=>bad(Error('시트 연결 준비 시간 초과')),15000))]);clearTimeout(readyTimer);const id='API-'+Date.now()+'-'+(++apiSeq),timer=setTimeout(()=>{apiPending.delete(id);reject(Error('서버 응답 시간 초과'))},60000);apiPending.set(id,{resolve,reject,timer});apiBridgeTarget.postMessage({type:'cheongun-api-request',id,body},'*')}catch(e){clearTimeout(readyTimer);reject(e)}})}
initApiBridge();
function loading(text,on=true){busy=on;$('#busyText').textContent=text;$('#busy').classList.toggle('hidden',!on)}
function current(){return(data['현재회차']||[])[0]||null}function placement(){const f=current();return f?String(f['입추일']).slice(0,10):''}function ageAt(date=today()){if(!placement())return 0;return Math.max(1,Math.floor((new Date(date+'T12:00:00')-new Date(placement()+'T12:00:00'))/86400000)+1)}function dateAt(age){const d=new Date(placement()+'T12:00:00');d.setDate(d.getDate()+age-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function pull(show=true,pageName=tab){const seq=++loadSeq;if(show)$('#sync').textContent='↻ 최신자료 확인 중';try{const r=await api({action:'pull',page:pageName});if(seq!==loadSeq)return;if(!r.ok)throw Error(r.error);data=Object.assign({},data,r.data||{});$('#sync').textContent='↻ 최신자료 받기\n'+checkedTime()+' 확인 · v'+VERSION;$('#sync').style.color='#176b3a';render()}catch(e){if(seq!==loadSeq)return;$('#sync').textContent='↻ 다시 시도\n동기화 실패';$('#sync').style.color='#c62828'}}
async function save(sheet,row,msg='저장 중...'){loading(msg);try{const r=await api({action:'save',sheet,row});if(!r.ok)throw Error(r.error);const list=data[sheet]||(data[sheet]=[]),i=list.findIndex(x=>String(x.id)===String(r.id));if(i>=0)list[i]=r.row||row;else list.push(r.row||row);$('#sync').textContent='↻ 최신자료 받기\n'+checkedTime()+' 저장 · v'+VERSION;$('#sync').style.color='#176b3a';return true}catch(e){alert('저장 실패: '+e.message);return false}finally{loading('',false)}}async function del(sheet,id){loading('삭제 중...');try{const r=await api({action:'delete',sheet,id});if(!r.ok)throw Error(r.error);await pull(false)}catch(e){alert('삭제 실패: '+e.message)}finally{loading('',false)}}
const nav=[['home','⌂','홈'],['journal','▤','사육일지'],['graph','⌁','그래프'],['ship','▣','출하'],['settings','⚙','설정'],['haccp','✓','HACCP']];function pageLabel(name){const x=nav.find(v=>v[0]===name);return x?x[2]+' 자료':'최신자료'}async function openTab(name){if(name===tab&&busy)return;tab=name;house=0;page(pageLabel(name).replace(' 자료',''),'최신자료를 불러오고 있습니다.','<div class="card empty">자료 불러오는 중…</div>');await pull(true,name)}function drawNav(){$('#nav').innerHTML=nav.map(x=>`<button data-tab="${x[0]}" class="${tab===x[0]?'on':''}"><b>${x[1]}</b>${x[2]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab))}
function page(title,sub,html){$('#view').innerHTML=`<section class="page"><h1>${title}</h1><p class="sub">${sub}</p>${html}</section>`;drawNav()}
function render(){const f=current();$('#farmTitle').textContent=(data['농장정보']&&data['농장정보'][0]&&data['농장정보'][0]['농장명'])||'청운농장';$('#ageTitle').textContent=f?'입추 '+placement()+' · '+ageAt()+'일령':'현재 사육 없음';({home:homeView,journal:journalView,graph:graphView,ship:shipView,settings:settingsView,haccp:haccpView}[tab]||homeView)()}
function houseButtons(selected=house){return`<div class="houses">${[1,2,3,4,5].map(h=>`<button data-house="${h}" class="${selected===h?'on':''}" style="--c:${C[h-1]}">${h}동</button>`).join('')}</div>`}
function homeLoadingView(){page('당일 기록','시트의 오늘 자료를 확인하고 있습니다.',`<div class="card"><b style="display:block;text-align:center;margin-bottom:10px;color:#68746c">자료 확인 후 입력할 수 있습니다</b><div class="houses">${[1,2,3,4,5].map(h=>`<button style="--c:${C[h-1]}" disabled>${h}동</button>`).join('')}</div><div class="grid2 numbers"><label class="field">폐사수<input value="0" disabled></label><label class="field">도태수<input value="0" disabled></label></div><div class="keypad">${[-1,10,5,1].map(n=>`<button disabled>${n>0?'+':''}${n}</button>`).join('')}</div><label class="field">특이사항<textarea disabled></textarea></label><button class="save" disabled>시트 자료 확인 중…</button></div>`)}

function evidenceView(){const photos=data['첨부파일']||[];page('증빙사진 관리','입추·출하 관련 중요 문서를 촬영해 최종 PDF에 포함합니다.',`<div class="card"><div class="grid2"><label class="field">구분<select id="ekind"><option>입추</option><option>출하</option></select></label><label class="field">동<select id="ehouse"><option value="0">전체</option>${[1,2,3,4,5].map(x=>`<option value="${x}">${x}동</option>`).join('')}</select></label></div><label class="field">문서 종류<input id="etype" placeholder="예: 살모넬라 검사확인서"></label><label class="field">사진 촬영·선택<input id="efile" type="file" accept="image/*" capture="environment"></label><button id="upload" class="save">증빙사진 저장</button><button id="back" class="sectionbtn">돌아가기</button></div><div class="card"><h2>저장된 사진</h2>${photos.map(x=>`<div class="record"><strong>${x['구분']}</strong><div><b>${esc(x['문서종류']||x['파일명'])}</b><small>${x['날짜']} · ${Number(x['동'])?x['동']+'동':'전체'}</small></div><button data-del-photo="${x.id}" class="danger">삭제</button></div>`).join('')||'<p class="empty">첨부사진이 없습니다.</p>'}</div>`);$('#back').onclick=settingsView;$('#upload').onclick=uploadEvidence;document.querySelectorAll('[data-del-photo]').forEach(b=>b.onclick=async()=>{if(!confirm('사진을 삭제할까요?'))return;loading('사진 삭제 중...');try{const r=await api({action:'deleteEvidence',id:b.dataset.delPhoto,password:admin});if(!r.ok)throw Error(r.error);await pull(false);evidenceView()}catch(e){alert(e.message)}finally{loading('',false)}})}
async function uploadEvidence(){const file=$('#efile').files[0],type=$('#etype').value.trim();if(!file||!type)return alert('문서 종류와 사진을 선택해주세요.');if(file.size>8*1024*1024)return alert('사진은 8MB 이하로 선택해주세요.');loading('증빙사진 저장 중...');try{const base64=await new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=bad;r.readAsDataURL(file)}),res=await api({action:'uploadEvidence',kind:$('#ekind').value,documentType:type,date:today(),house:Number($('#ehouse').value),mimeType:file.type,base64});if(!res.ok)throw Error(res.error);await pull(false);evidenceView()}catch(e){alert('사진 저장 실패: '+e.message)}finally{loading('',false)}}
function newFlockView(){const farm=(data['농장정보']||[])[0]||{},ccp=['입추 차량 위생상태','병아리 외관·활력','운송 중 폐사 확인','입추 수량 확인','검사증명서 확인'];page('새 파스 생성','입추 기본정보와 CCP-1B를 한 화면에서 작성합니다.',`<div class="card"><h2>1. 입추 기본정보</h2><label class="field">입추일<input id="pdate" type="date" value="${today()}"></label><label class="field">덤 비율(%)<input id="bonus" type="number" step=".1" value="${farm['기본덤비율']||3}"></label>${[1,2,3,4,5].map(h=>`<label class="field">${h}동 공식 입추수<input data-ph="${h}" type="number" inputmode="numeric"></label>`).join('')}<div class="grid2"><label class="field">품종<input id="breed" placeholder="육계 품종명"></label><label class="field">평균중량(g)<input id="avg" type="number" step=".1"></label></div><label class="field">도입처<input id="supplier"></label><h2>2. CCP-1B 입추점검</h2><div class="choices">${ccp.map(x=>`<button data-pccp data-value="${x}">${x}</button>`).join('')}</div><label class="field">살모넬라 등 검사결과<select id="pse"><option value="적합">적합</option><option value="부적합">부적합</option><option value="확인중">확인중</option></select></label><label class="field">이상 시 개선조치<textarea id="paction"></textarea></label><label class="field">입추 특이사항<textarea id="pnote"></textarea></label><p class="note">관련 검사확인서 사진은 파스 생성 후 설정의 증빙사진 관리에서 등록합니다.</p><button id="start" class="save">새 파스 시작</button></div>`);toggleButtons('[data-pccp]',true);$('#start').onclick=async()=>{const houses=[...document.querySelectorAll('[data-ph]')].map(x=>Number(x.value)),checks=selected('[data-pccp]');if(houses.some(x=>x<=0))return alert('1~5동 입추수를 입력해주세요.');if(checks.length!==ccp.length)return alert('CCP-1B 점검항목을 모두 확인해주세요.');loading('새 파스 생성 중...');try{const r=await api({action:'startFlock',password:admin,flock:{placementDate:$('#pdate').value,bonus:Number($('#bonus').value),houses,breed:$('#breed').value.trim(),avgWeight:Number($('#avg').value),supplier:$('#supplier').value.trim(),note:$('#pnote').value.trim(),ccpChecks:checks,se:$('#pse').value,action:$('#paction').value.trim()}});if(!r.ok)throw Error(r.error);tab='home';await pull(false,'home')}catch(e){alert(e.message)}finally{loading('',false)}}}
function completionIssues(){const issues=[],ships=data['출하기록']||[],checks=data['일일점검']||[],photos=data['첨부파일']||[];[1,2,3,4,5].forEach(h=>{if(!ships.some(x=>Number(x['동'])===h&&x['구분']==='전체출하'))issues.push(h+'동 전체출하 미입력');if(!checks.some(x=>Number(x['동'])===h))issues.push(h+'동 오늘점검 없음')});if(!photos.some(x=>x['구분']==='입추'))issues.push('입추 증빙사진 없음');if(!photos.some(x=>x['구분']==='출하'))issues.push('출하 증빙사진 없음');return issues}
function openUrl(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
async function reportAction(action){const complete=action==='completeFlock';if(complete){const issues=completionIssues(),warning=issues.length?'\n\n확인 필요:\n- '+issues.join('\n- '):'';if(!confirm('PDF가 정상 생성된 뒤에만 현재 파스 자료를 초기화합니다.'+warning+'\n\n계속할까요?'))return}loading(complete?'최종 PDF 생성·검증 및 사육완료 처리 중...':'종합보고서 생성 중...');try{const r=await api({action,password:admin,endDate:today()});if(!r.ok)throw Error(r.error);await pull(false);openUrl(r.url);if(complete)alert('사육완료 처리되었습니다. 종합보고서 PDF만 보관됩니다.')}catch(e){alert('처리 실패: '+e.message+'\n시트자료는 삭제하지 않았습니다.')}finally{loading('',false)}}
window.addEventListener('load',()=>{if(location.hostname.endsWith('github.io')&&'serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js?v=15');$('#sync').onclick=()=>{if($('#busy').classList.contains('hidden'))pull(true,tab)};homeLoadingView();pull(true,'home')});
</script></body></html>
